name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build, publish, and release gate
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Repository conventions
        shell: pwsh
        run: .\scripts\VerifyRepo.ps1

      - name: Package cleanliness gate
        shell: pwsh
        run: .\scripts\PkgCleanGate.ps1

      - name: Restore solution
        run: dotnet restore .\HakamiqChdTool.App.sln --locked-mode

      - name: Verify deterministic CycloneDX SBOM
        shell: pwsh
        run: |
          .\scripts\GenerateSbom.ps1
          git diff --exit-code -- .\docs\sbom.cdx.json

      - name: Build Debug solution
        run: dotnet build .\HakamiqChdTool.App.sln -c Debug --no-restore --nologo -p:NuGetAudit=false

      - name: PS2 and P0 validation tests
        shell: pwsh
        run: .\scripts\Ps2AdvTests.ps1 -SkipAppBuild

      - name: Build Release solution
        run: dotnet build .\HakamiqChdTool.App.sln -c Release --no-restore --nologo -p:NuGetAudit=false

      - name: Restore Release win-x64
        run: dotnet restore .\HakamiqChdTool.App.csproj -r win-x64 --locked-mode

      - name: Build Release win-x64
        run: dotnet build .\HakamiqChdTool.App.csproj -c Release -r win-x64 --no-restore --nologo -p:NuGetAudit=false

      - name: Publish and verify end-user release
        shell: pwsh
        run: .\scripts\RelOutGate.ps1 -Output .\Release\ci-output -KeepOutput

      - name: Pack verified release artifact
        shell: pwsh
        run: .\scripts\PackRel.ps1 -ReleaseOutput .\Release\ci-output -PackageDirectory .\Release\packages

      - name: Upload release package artifact
        uses: actions/upload-artifact@v6
        with:
          name: HakamiqChdTool-win-x64
          path: Release/packages/
          if-no-files-found: error
