name: Secure signed release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build
        required: true
      version:
        description: Release version without v prefix
        required: true
      publish_release:
        description: Create the GitHub Release after all gates pass
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  signed-release:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      REQUESTED_REF: ${{ inputs.ref }}

    steps:
      - name: Checkout requested source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate release inputs and tag binding
        shell: powershell
        run: |
          if ($env:RELEASE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "version must contain exactly three numeric components."
          }

          [xml] $project = Get-Content -LiteralPath .\HakamiqChdTool.App.csproj -Raw
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($null -eq $versionNode) {
            throw "HakamiqChdTool.App.csproj does not declare Version."
          }

          $projectVersion = $versionNode.InnerText.Trim()
          if ($projectVersion -ne $env:RELEASE_VERSION) {
            throw "Release input version $env:RELEASE_VERSION does not match project version $projectVersion."
          }

          $tag = "v$env:RELEASE_VERSION"
          $allowedRefs = @($tag, "refs/tags/$tag")
          if ($allowedRefs -notcontains $env:REQUESTED_REF) {
            throw "ref must be the immutable release tag $tag (or refs/tags/$tag)."
          }

          git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) {
            throw "Could not refresh Git tags before release signing."
          }

          $tagCommit = (git rev-parse "$tag^{commit}" 2>$null | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
            throw "Release tag does not exist: $tag"
          }

          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve checked-out HEAD."
          }

          if ($tagCommit.Trim() -ne $headCommit) {
            throw "Release tag $tag does not point to the checked-out revision."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Require signing secrets
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.HAKAMIQ_CODESIGN_PFX_BASE64 }}
          HAKAMIQ_SIGNING_PFX_PASSWORD: ${{ secrets.HAKAMIQ_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            throw "HAKAMIQ_CODESIGN_PFX_BASE64 is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:HAKAMIQ_SIGNING_PFX_PASSWORD)) {
            throw "HAKAMIQ_CODESIGN_PFX_PASSWORD is required."
          }

      - name: Set deterministic source epoch
        shell: powershell
        run: |
          $epoch = (git show -s --format=%ct HEAD).Trim()
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV

      - name: Restore locked dependencies
        shell: powershell
        run: dotnet restore .\HakamiqChdTool.App.sln --locked-mode

      - name: Verify SBOM matches locked release inputs
        shell: pwsh
        run: |
          .\scripts\GenerateSbom.ps1
          git diff --exit-code -- .\docs\sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "Committed SBOM does not match the locked release inputs." }

      - name: Build and test
        shell: powershell
        run: |
          dotnet build .\HakamiqChdTool.App.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Release build failed." }
          dotnet .\HakamiqChdTool.App.Tests\bin\Release\net10.0-windows10.0.17763.0\HakamiqChdTool.App.Tests.dll --app-assembly .\bin\Release\net10.0-windows10.0.17763.0\win-x64\HakamiqChdTool.dll
          if ($LASTEXITCODE -ne 0) { throw "Application tests failed." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\VerifyRepo.ps1
          if ($LASTEXITCODE -ne 0) { throw "Repository verification failed." }

      - name: Verify same-runner reproducibility before signing
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\VerifyReproducibleBuild.ps1
          -ReportPath .\TestResults\Security\reproducible-build-report.json

      - name: Publish unsigned deterministic candidate
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\PublishRel.ps1
          -Configuration Release
          -Output .\Release\signed-candidate

      - name: Materialize signing certificate
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.HAKAMIQ_CODESIGN_PFX_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP "hakamiq-signing.pfx"), $bytes)

      - name: Authenticode sign and RFC 3161 timestamp
        shell: powershell
        env:
          HAKAMIQ_SIGNING_PFX_PASSWORD: ${{ secrets.HAKAMIQ_CODESIGN_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "hakamiq-signing.pfx"
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File .\scripts\SignRelease.ps1 `
              -Output .\Release\signed-candidate `
              -PfxPath $pfxPath
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Verify signed release policy
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\VerifyRelease.ps1
          -Output .\Release\signed-candidate
          -RequireAuthenticode

      - name: Microsoft Defender scan signed candidate directory
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\ScanReleaseDefender.ps1
          -Target .\Release\signed-candidate
          -ReportPath .\TestResults\Security\defender-signed-directory-report.json

      - name: Create deterministic signed package
        shell: powershell
        run: |
          $packageName = "HakamiqChdTool-v${env:RELEASE_VERSION}-win-x64-runtime-required.zip"
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\PackRel.ps1 `
            -ReleaseOutput .\Release\signed-candidate `
            -PackageDirectory .\Release\packages `
            -PackageName $packageName `
            -RequireAuthenticode
          if ($LASTEXITCODE -ne 0) { throw "Signed package creation failed." }

      - name: Microsoft Defender scan final ZIP
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\ScanReleaseDefender.ps1
          -Target .\Release\packages\HakamiqChdTool-v${{ env.RELEASE_VERSION }}-win-x64-runtime-required.zip
          -ReportPath .\TestResults\Security\defender-final-zip-report.json

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: Release/packages/HakamiqChdTool-v${{ env.RELEASE_VERSION }}-win-x64-runtime-required.zip

      - name: Verify generated attestation
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = ".\Release\packages\HakamiqChdTool-v${env:RELEASE_VERSION}-win-x64-runtime-required.zip"
          gh attestation verify $package --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Generated attestation verification failed." }

      - name: Upload signed candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: HakamiqChdTool-v${{ env.RELEASE_VERSION }}-signed-candidate
          path: |
            Release/packages/*
            TestResults/Security/reproducible-build-report.json
            TestResults/Security/defender-signed-directory-report.json
            TestResults/Security/defender-final-zip-report.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish_release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $package = ".\Release\packages\HakamiqChdTool-v${env:RELEASE_VERSION}-win-x64-runtime-required.zip"
          gh release create $tag `
            $package `
            "$package.sha256" `
            --verify-tag `
            --title "Hakamiq CHD Tool $tag" `
            --generate-notes
